<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - QuickBite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar sticky">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span class="logo-icon">🍔</span>
                <span>QuickBite</span>
            </div>
            <div class="navbar-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="restaurants.html" class="nav-link active">Restaurants</a>
                <a href="cart.html" class="nav-link">Cart</a>
            </div>
            <div class="navbar-cart">
                <a href="cart.html" class="cart-icon">
                    🛒
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>All Restaurants</h1>
        <p>Browse and discover amazing restaurants</p>
    </section>

    <!-- Search and Filter Section -->
    <section class="search-filter-section">
        <div class="search-filter-container">
            <input 
                type="text" 
                class="search-input" 
                id="restaurantSearch" 
                placeholder="🔍 Search restaurants or cuisine..."
            >
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Italian">Italian</button>
                <button class="filter-btn" data-filter="Indian">Indian</button>
                <button class="filter-btn" data-filter="Chinese">Chinese</button>
                <button class="filter-btn" data-filter="Japanese">Japanese</button>
                <button class="filter-btn" data-filter="American">American</button>
            </div>

            <div class="sort-container">
                <label for="sortBy">Sort by:</label>
                <select id="sortBy" class="sort-select">
                    <option value="name">Name</option>
                    <option value="rating">Rating (High to Low)</option>
                    <option value="delivery">Delivery Time</option>
                    <option value="price">Price (Low to High)</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Restaurants Grid -->
    <section class="restaurants-section">
        <div class="restaurants-grid" id="restaurantsGrid">
            <!-- Restaurants will be populated by JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>QuickBite</h4>
                <p>Your favorite food, delivered fast.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="restaurants.html">Restaurants</a></li>
                    <li><a href="cart.html">Cart</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Contact</h4>
                <p>Email: hello@quickbite.com</p>
                <p>Phone: +1 (555) 123-4567</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 QuickBite. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Initialize restaurants page
        document.addEventListener('DOMContentLoaded', function() {
            initializeRestaurantsPage();
        });

        function initializeRestaurantsPage() {
            const restaurantsGrid = document.getElementById('restaurantsGrid');
            const restaurantSearch = document.getElementById('restaurantSearch');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const sortSelect = document.getElementById('sortBy');

            // Render initial restaurants
            renderRestaurants(restaurantData);

            // Search functionality
            restaurantSearch.addEventListener('input', function() {
                filterAndSortRestaurants();
            });

            // Filter functionality
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    filterAndSortRestaurants();
                });
            });

            // Sort functionality
            sortSelect.addEventListener('change', function() {
                filterAndSortRestaurants();
            });
        }

        function filterAndSortRestaurants() {
            const searchValue = document.getElementById('restaurantSearch').value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
            const sortValue = document.getElementById('sortBy').value;

            let filtered = restaurantData.filter(restaurant => {
                const matchesSearch = restaurant.name.toLowerCase().includes(searchValue) || 
                                     restaurant.cuisine.toLowerCase().includes(searchValue);
                const matchesFilter = activeFilter === 'all' || restaurant.cuisine === activeFilter;
                return matchesSearch && matchesFilter;
            });

            // Sort
            if (sortValue === 'rating') {
                filtered.sort((a, b) => b.rating - a.rating);
            } else if (sortValue === 'delivery') {
                filtered.sort((a, b) => a.deliveryTime - b.deliveryTime);
            } else if (sortValue === 'price') {
                filtered.sort((a, b) => a.priceForTwo - b.priceForTwo);
            } else if (sortValue === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            renderRestaurants(filtered);
        }

        function renderRestaurants(restaurants) {
            const restaurantsGrid = document.getElementById('restaurantsGrid');
            restaurantsGrid.innerHTML = '';

            if (restaurants.length === 0) {
                restaurantsGrid.innerHTML = '<p class="no-results">No restaurants found. Try a different search!</p>';
                return;
            }

            restaurants.forEach(restaurant => {
                const restaurantCard = document.createElement('div');
                restaurantCard.className = 'restaurant-card';
                restaurantCard.onclick = function() {
                    navigateToMenu(restaurant.id);
                };
                
                restaurantCard.innerHTML = `
                    <div class="restaurant-image-container">
                        <img src="${restaurant.image}" alt="${restaurant.name}" class="restaurant-img">
                        <span class="rating-badge">${restaurant.rating}⭐</span>
                        <span class="delivery-badge">${restaurant.deliveryTime} mins</span>
                    </div>
                    <div class="restaurant-details">
                        <h3 class="restaurant-name">${restaurant.name}</h3>
                        <p class="restaurant-cuisine">${restaurant.cuisine}</p>
                        <div class="restaurant-footer">
                            <span class="price-range">${'💰'.repeat(restaurant.priceLevel)}</span>
                            <span class="cuisine-tag">${restaurant.cuisine}</span>
                        </div>
                    </div>
                `;
                restaurantsGrid.appendChild(restaurantCard);
            });
        }
    </script>
</body>
</html>
